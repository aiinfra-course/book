<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vLLM v1 调度架构</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'SF Mono','Monaco',monospace;background:#1a1a1a;color:#fff;padding:14px;}
h1{font-size:1.05rem;text-align:center;color:#4ade80;margin-bottom:3px;}
.subtitle{font-size:0.65rem;color:#555;text-align:center;margin-bottom:10px;}
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.btn{padding:6px 14px;border:none;border-radius:5px;font-size:0.72rem;cursor:pointer;}
.btn.primary{background:#4a9eff;color:#fff;}
.btn.secondary{background:#2a2a2a;color:#aaa;}
.event{background:#0d1f0d;border-left:3px solid #4ade80;padding:7px 11px;
  border-radius:0 5px 5px 0;font-size:0.7rem;color:#bbb;margin-bottom:12px;}
.event .t{color:#4ade80;font-weight:700;margin-right:6px;}

/* Two queues */
.queues{display:flex;align-items:flex-start;gap:0;margin-bottom:12px;}
.queue{background:#1e1e1e;border-radius:8px;padding:10px;flex:1;}
.queue-title{font-size:0.62rem;text-transform:uppercase;letter-spacing:1px;
  margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #2a2a2a;}
.q-waiting .queue-title{color:#d09050;}
.q-running .queue-title{color:#4ade80;}
.q-waiting{border:1px solid #3a2010;}
.q-running{border:1px solid #1a4a2a;}

.arrow-col{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 8px;gap:3px;min-width:44px;}
.arr{font-size:1.1rem;color:#2a7a4a;}
.arr-label{font-size:0.5rem;color:#2a6a3a;text-align:center;}

.req-pill{display:inline-block;padding:3px 8px;border-radius:10px;
  font-size:0.62rem;font-weight:700;margin:2px;transition:all 0.3s;}

.phase-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.phase-badge{font-size:0.5rem;padding:1px 5px;border-radius:3px;font-weight:600;}
.pb-prefill{background:#1a3050;color:#6aaae0;}
.pb-decode{background:#1a3a1a;color:#5ad07a;}
.pb-preempted{background:#3a1010;color:#e06060;}
.pb-resume{background:#0a2a1a;color:#40d080;}

.running-note{font-size:0.52rem;color:#2a8a4a;margin-top:8px;padding-top:6px;
  border-top:1px solid #1a3a1a;}

/* Counter visualization */
.counter-section{background:#0d1a10;border:1px solid #1a3a1a;border-radius:7px;padding:10px;margin-bottom:10px;}
.counter-title{font-size:0.6rem;color:#2a9a5a;margin-bottom:8px;}
.ctr-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.ctr-row:last-child{margin-bottom:0;}
.ctr-name{font-size:0.6rem;font-weight:700;width:44px;}
.ctr-bar-wrap{flex:1;height:12px;background:#111;border-radius:5px;overflow:hidden;position:relative;}
.ctr-bar{height:100%;border-radius:5px;transition:width 0.5s;}
.ctr-bar .prefill-seg{height:100%;float:left;}
.ctr-bar .decode-seg{height:100%;float:left;}
.ctr-nums{font-size:0.58rem;min-width:80px;text-align:right;}
.ctr-status{font-size:0.5rem;padding:1px 5px;border-radius:3px;margin-left:4px;}

/* Free explanation */
.free-box{background:#1a1010;border:1px solid #3a1a1a;border-radius:6px;padding:8px 10px;margin-bottom:10px;}
.free-title{font-size:0.6rem;color:#d06060;margin-bottom:5px;}
.free-step{display:flex;align-items:baseline;gap:6px;font-size:0.62rem;color:#aaa;margin-bottom:3px;}
.free-num{font-weight:700;color:#4ade80;min-width:18px;}

.insight{background:#0d1f0d;border:1px solid #1a3a1a;border-radius:6px;
  padding:8px 10px;font-size:0.63rem;color:#80d080;line-height:1.6;}
.insight.bad{background:#1f0d0d;border-color:#3a1a1a;color:#d08080;}
.empty-note{color:#444;font-size:0.6rem;padding:4px 0;}
</style>
</head>
<body>
<h1>vLLM v1 — 两队列 + num_computed_tokens 统一调度</h1>
<p class="subtitle">无阶段区分，无 Swap，Prefill + Decode 在同一 batch 混跑</p>

<div class="controls">
  <button class="btn secondary" onclick="prev()">◀</button>
  <button class="btn primary" id="playBtn" onclick="togglePlay()">▶ 播放</button>
  <button class="btn secondary" onclick="next()">▶</button>
  <button class="btn secondary" onclick="resetAnim()">重置</button>
</div>
<div class="event" id="event"></div>

<div class="queues">
  <div class="queue q-waiting">
    <div class="queue-title">⏳ WAITING</div>
    <div id="q-waiting"></div>
  </div>
  <div class="arrow-col">
    <div class="arr">⇄</div>
    <div class="arr-label">调度/<br>抢占</div>
  </div>
  <div class="queue q-running" style="flex:1.6">
    <div class="queue-title">🚀 RUNNING</div>
    <div id="q-running"></div>
    <div class="running-note" id="running-note">✅ Prefill + Decode 可以在同一 batch 混跑</div>
  </div>
</div>

<!-- Counter section -->
<div class="counter-section">
  <div class="counter-title">num_computed_tokens — 统一追踪每个请求的进度（无需状态标签）</div>
  <div id="counters"></div>
</div>

<!-- Preemption explanation (shown when relevant) -->
<div class="free-box" id="free-box" style="display:none">
  <div class="free-title">⚡ 抢占执行（_preempt_request）</div>
  <div id="free-steps"></div>
</div>

<div class="insight" id="insight"></div>

<script>
const REQS={
  A:{label:'Req A',color:'#4a9eff',prompt:32,decode:48},
  B:{label:'Req B',color:'#f0a040',prompt:16,decode:48},
  C:{label:'Req C',color:'#f06080',prompt:48,decode:32},
};

function pill(id,extra=''){
  const r=REQS[id]||{label:id,color:'#888'};
  return `<span class="req-pill" style="background:${r.color}20;color:${r.color};border:1px solid ${r.color}40">${r.label}${extra}</span>`;
}

const steps=[
  {
    event:'场景 1  A(Prefill), B(Decode), C(waiting)。v1 不区分阶段——调度器只看 num_computed_tokens',
    waiting:['C'],
    running:[{id:'A',phase:'prefill'},{id:'B',phase:'decode'}],
    computed:{A:20,B:40,C:0},
    showFree:false,
    insight:'v1 关键：A 和 B 可以在同一 batch 里！\n调度器不关心"谁在 Prefill 谁在 Decode"\n只看 num_computed_tokens < num_prompt? 就是 Prefill，否则是 Decode',
  },
  {
    event:'场景 2  C 加入 running。A(Prefill) + B(Decode) + C(Prefill) 三者同在一个 batch——v1 完全支持',
    waiting:[],
    running:[{id:'A',phase:'prefill'},{id:'B',phase:'decode'},{id:'C',phase:'prefill'}],
    computed:{A:28,B:48,C:10},
    showFree:false,
    insight:'✅ Prefill + Decode 混跑！\nA 还有 4 tokens 没算完（Prefill 中）\nB 已过 prompt，在生成 output（Decode 中）\nC 刚开始 Prefill\n→ 全部在同一 batch 里一起跑',
  },
  {
    event:'场景 3  内存不足：需要抢占。v1 直接 free KV blocks，重置计数器，放回 waiting 头部——无需 Swap',
    waiting:[{id:'B',preempted:true}],
    running:[{id:'A',phase:'prefill'},{id:'C',phase:'decode'}],
    computed:{A:32,B:0,C:48},
    showFree:true,
    freeSteps:[
      '① kv_cache_manager.free(B)  →  KV blocks 立刻释放，显存归还',
      '② B.num_computed_tokens = 0  →  进度清零',
      '③ B.status = PREEMPTED',
      '④ waiting.prepend_request(B)  →  放回头部，下轮优先',
    ],
    insight:'v1 抢占 vs v0 Swap：\nv0：KV 写出 CPU → 等内存释放 → KV 传回 GPU（PCIe 往返，慢 100×）\nv1：直接 free，重算（prefix cache 命中可跳过大部分）\n→ 现代 GPU 上重算往往比 PCIe 传输更快',
  },
  {
    event:'场景 4  下一轮：B 优先恢复（waiting 头部），prefix cache 可能命中，跳过已算部分',
    waiting:[],
    running:[{id:'A',phase:'decode'},{id:'B',phase:'prefill',resumed:true},{id:'C',phase:'decode'}],
    computed:{A:36,B:14,C:52},
    showFree:false,
    insight:'✅ B 恢复时：\nget_computed_blocks(B) 检查 prefix cache\n→ 若命中：num_computed_tokens 直接跳到命中位置\n→ 不用从头重算所有 tokens\nA/B/C 三者继续在同一 batch 混跑',
  },
];

let cur=0,playing=false,timer=null;

function render(){
  const s=steps[cur];
  document.getElementById('event').innerHTML=`<span class="t">场景 ${cur+1}</span>${s.event}`;

  // Waiting
  document.getElementById('q-waiting').innerHTML=
    s.waiting.length?s.waiting.map(w=>{
      if(w.preempted) return `<div class="phase-row">${pill(w.id)}<span class="phase-badge pb-preempted">PREEMPTED</span></div>`;
      return pill(w);
    }).join(''):'<div class="empty-note">空</div>';

  // Running
  document.getElementById('q-running').innerHTML=s.running.map(r=>{
    let badge='';
    if(r.resumed) badge=`<span class="phase-badge pb-resume">恢复中</span>`;
    else if(r.phase==='prefill') badge=`<span class="phase-badge pb-prefill">Prefill</span>`;
    else badge=`<span class="phase-badge pb-decode">Decode</span>`;
    return `<div class="phase-row">${pill(r.id)}${badge}</div>`;
  }).join('')||'<div class="empty-note">空</div>';

  // Counters
  let cHtml='';
  Object.entries(s.computed).forEach(([id,comp])=>{
    const r=REQS[id];
    if(!r) return;
    const total=r.prompt+r.decode;
    const pct=Math.round(comp/total*100);
    const ppct=Math.round(r.prompt/total*100);
    const isPreempted=s.waiting.find(w=>w.preempted&&w.id===id);
    const phase=comp<r.prompt?(comp===0&&isPreempted?'PREEMPTED':comp===0?'WAITING':'Prefill'):'Decode';
    const phaseColor=phase==='Decode'?'#1a3a1a':phase==='Prefill'?'#1a3050':'#2a1010';
    const phaseText=phase==='Decode'?'#5ad07a':phase==='Prefill'?'#6aaae0':'#e06060';
    cHtml+=`<div class="ctr-row">
      <div class="ctr-name" style="color:${r.color}">${r.label}</div>
      <div class="ctr-bar-wrap">
        <div style="height:100%;width:${pct}%;background:${r.color};border-radius:5px;transition:width 0.5s;"></div>
        <div style="position:absolute;top:0;left:${ppct}%;height:100%;width:1px;background:rgba(255,255,255,0.2);"></div>
      </div>
      <div class="ctr-nums" style="color:${r.color}">${comp}/${total}</div>
      <span class="ctr-status" style="background:${phaseColor};color:${phaseText}">${phase}</span>
    </div>`;
  });
  document.getElementById('counters').innerHTML=cHtml;

  // Free box
  const fb=document.getElementById('free-box');
  if(s.showFree){
    fb.style.display='block';
    document.getElementById('free-steps').innerHTML=(s.freeSteps||[]).map(
      t=>`<div class="free-step"><span class="free-num">→</span>${t}</div>`
    ).join('');
  } else {
    fb.style.display='none';
  }

  document.getElementById('insight').innerHTML=s.insight.replace(/\n/g,'<br>');
}

function next(){if(cur<steps.length-1){cur++;render();}}
function prev(){if(cur>0){cur--;render();}}
function togglePlay(){
  if(playing){clearInterval(timer);playing=false;document.getElementById('playBtn').textContent='▶ 播放';}
  else{playing=true;document.getElementById('playBtn').textContent='⏸ 暂停';
    timer=setInterval(()=>{if(cur<steps.length-1){cur++;render();}else{clearInterval(timer);playing=false;document.getElementById('playBtn').textContent='▶ 播放';}},2200);}
}
function resetAnim(){clearInterval(timer);playing=false;document.getElementById('playBtn').textContent='▶ 播放';cur=0;render();}
render();
</script>
</body>
</html>
