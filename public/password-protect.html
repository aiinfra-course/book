<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>请输入密码</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #16213e;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 1rem;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4a9eff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #5aa8ff;
    }
    .error {
      color: #ff4757;
      margin-top: 12px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>请输入密码</h1>
    <input type="password" id="password" placeholder="输入密码">
    <button onclick="checkPassword()">确认</button>
    <div class="error" id="error">密码错误，请重试</div>
  </div>

  <script>
    const PASSWORD = 'demo123'; // 在这里设置你的密码

    function checkPassword() {
      const input = document.getElementById('password').value;
      if (input === PASSWORD) {
        sessionStorage.setItem('auth', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });
  </script>
</body>
</html>
